<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedang Offline - ZCal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #fefce8 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #111827;
        }
        .container {
            padding: 2rem;
            max-width: 400px;
        }
        img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.025em;
        }
        p {
            font-size: 0.95rem;
            color: #4b5563;
            margin: 0 0 2rem 0;
            line-height: 1.5;
        }
        button {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(22, 163, 74, 0.3);
        }
        button:hover {
            background-color: #15803d;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/images/illustration/mascot-apel-ceria.png" alt="Offline">
        <h1>Ups! Kamu Sedang Offline</h1>
        <p>Koneksi internetmu sepertinya terputus. Silakan periksa jaringanmu dan coba lagi untuk melanjutkan pencatatan di ZCal.</p>
        <button onclick="window.location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
