<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Sheet — Wireframe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #e0e0e0; display: flex; justify-content: center; padding: 20px 0; }
        .wf-screen { width: 375px; min-height: 667px; background: rgba(0,0,0,0.3); border: 2px dashed #ccc; position: relative; display: flex; flex-direction: column; justify-content: flex-end; }
        .bottom-sheet { background: #fff; border-radius: 24px 24px 0 0; padding: 24px; text-align: center; }
        .wf-button { background: #ccc; border: 1px dashed #999; padding: 16px; font-size: 16px; font-weight: 600; color: #444; border-radius: 12px; cursor: pointer; margin-bottom: 12px; }
        a.wf-link { color: inherit; text-decoration: none; display: contents; }
    </style>
</head>
<body>
    <div class="wf-screen">
        <div class="bottom-sheet">
            <div style="width: 40px; height: 4px; background: #ccc; border-radius: 2px; margin: 0 auto 24px auto;"></div>
            
            <a href="form-transaksi.html" class="wf-link">
                <div class="wf-button">Catat Transaksi</div>
            </a>
            <a href="form-makanan.html" class="wf-link">
                <div class="wf-button" style="background: #e0e0e0;">Catat Makanan</div>
            </a>
            
            <a href="beranda.html" class="wf-link">
                <div style="margin-top: 16px; color: #666; font-size: 14px;">Batal</div>
            </a>
        </div>
    </div>
</body>
</html>
