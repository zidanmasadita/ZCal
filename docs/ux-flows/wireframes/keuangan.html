<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan — Wireframe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #e0e0e0; display: flex; justify-content: center; padding: 20px 0; }
        .wf-screen { width: 375px; min-height: 667px; background: #f5f5f5; border: 2px dashed #ccc; position: relative; display: flex; flex-direction: column; }
        .wf-header { background: #e8e8e8; border-bottom: 1px dashed #ccc; padding: 12px 16px; font-size: 18px; font-weight: 600; color: #444; text-align: center; }
        .wf-content { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .wf-card { background: #fff; border: 1px dashed #ccc; border-radius: 16px; padding: 16px; }
        .wf-list-item { background: #fff; border: 1px dashed #ccc; padding: 12px 16px; display: flex; align-items: center; gap: 12px; font-size: 14px; color: #666; }
        .wf-tab-bar { background: #e8e8e8; border-top: 1px dashed #ccc; padding: 8px 0; display: flex; justify-content: space-around; margin-top: auto; padding-bottom: 16px; }
        .wf-tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #888; }
        .wf-tab-item.active { color: #444; }
        .wf-icon-placeholder { width: 24px; height: 24px; background: #ddd; border: 1px dashed #bbb; border-radius: 4px; flex-shrink: 0; }
        .wf-title { font-size: 20px; font-weight: 600; color: #444; }
        a.wf-link { color: inherit; text-decoration: none; display: contents; }
        .budget-bar { height: 8px; background: #ccc; border-radius: 4px; width: 100%; margin-top: 8px; position: relative;}
        .budget-fill { height: 100%; background: #666; border-radius: 4px; width: 60%; }
    </style>
</head>
<body>
    <div class="wf-screen">
        <div class="wf-header">Keuangan</div>
        <div class="wf-content">
            <div style="display:flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;">
                <div style="padding: 6px 12px; background:#ccc; border-radius: 16px; font-size: 12px;">Semua</div>
                <div style="padding: 6px 12px; background:#fff; border:1px dashed #ccc; border-radius: 16px; font-size: 12px;">Tunai</div>
                <div style="padding: 6px 12px; background:#fff; border:1px dashed #ccc; border-radius: 16px; font-size: 12px;">BCA</div>
            </div>
            
            <div class="wf-card">
                <div style="font-size: 12px; color: #888;">Total Saldo</div>
                <div class="wf-title">Rp 4.500.000</div>
            </div>

            <div class="wf-card">
                <div style="font-weight: 600;">Anggaran Bulan Ini</div>
                <div style="margin-top: 12px; font-size: 12px;">Makanan & Minuman (60%)</div>
                <div class="budget-bar"><div class="budget-fill"></div></div>
                <div style="font-size: 10px; color: #888; margin-top: 4px;">Rp 900.000 / Rp 1.500.000</div>
            </div>

            <div style="font-weight: 600; margin-top: 12px;">3 Okt 2026</div>
            <a href="form-transaksi.html" class="wf-link">
                <div class="wf-list-item">
                    <div class="wf-icon-placeholder" style="border-radius: 50%;"></div>
                    <div style="flex:1;">
                        <div style="font-weight:bold; color:#444;">Makan Siang</div>
                        <div style="font-size:12px;">BCA</div>
                    </div>
                    <div style="color: red;">- Rp 45.000</div>
                </div>
            </a>
        </div>
        <div class="wf-tab-bar">
            <a href="beranda.html" class="wf-link"><div class="wf-tab-item"><div class="wf-icon-placeholder"></div>Beranda</div></a>
            <a href="keuangan.html" class="wf-link"><div class="wf-tab-item active"><div class="wf-icon-placeholder"></div>Keuangan</div></a>
            <a href="tambah-sheet.html" class="wf-link"><div class="wf-tab-item"><div class="wf-icon-placeholder" style="border-radius:50%; background:#888;"></div>Tambah</div></a>
            <a href="kalori.html" class="wf-link"><div class="wf-tab-item"><div class="wf-icon-placeholder"></div>Kalori</div></a>
            <a href="lainnya.html" class="wf-link"><div class="wf-tab-item"><div class="wf-icon-placeholder"></div>Lainnya</div></a>
        </div>
    </div>
</body>
</html>
